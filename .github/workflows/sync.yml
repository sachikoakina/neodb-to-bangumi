# 定时 / 手动迁移：NeoDB 书架 → Bangumi 收藏。
# 手动触发时，GitHub Actions 页面会出现「Run workflow」按钮（workflow_dispatch）。
name: sync

# 最小权限：本工作流只读取仓库并与外部 API 通信。
permissions:
  contents: read

# 绝不让两次迁移重叠：第二次会与第一次争用 `.cache/` 状态，并可能重复写入 Bangumi。
# `cancel-in-progress: false` 是刻意的：中断一次做到一半的迁移，比让下一次排队更糟。
concurrency:
  group: sync
  cancel-in-progress: false

on:
  workflow_dispatch: # 手动触发按钮
    inputs:
      # 全量重导：本次运行取消 SYNC_MAX_ITEMS / NEODB_MAX_PAGES 上限，并忽略增量。
      # 默认 false，让「手动跑一次做快速检查」仍然受封顶约束。
      full_sync:
        description: '全量迁移（忽略条目/页数上限、关闭增量）— 较慢'
        type: boolean
        default: false
      # 只算不写：核对计划与未匹配清单，不产生任何写入。
      dry_run:
        description: '只输出计划，不写入 Bangumi'
        type: boolean
        default: false
      # 本次运行临时开启进度拉满（默认仍受 SYNC_PROGRESS 变量控制）。
      progress:
        description: '本次拉满 complete 条目的进度（书籍/电影/分集）'
        type: boolean
        default: false
  schedule:
    # 每天上海时间 03:15（UTC+8，无夏令时）→ 前一日 19:15 UTC。
    # 与仓库 Variables 中的增量状态缓存配合，每轮继续推进尚未同步的条目。
    - cron: '15 19 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    # 常规运行受 SYNC_MAX_ITEMS / NEODB_MAX_PAGES 与请求节流约束，一小时足够；
    # 全量导入没有这些上限，单独给 180 分钟。
    timeout-minutes: ${{ inputs.full_sync && 180 || 60 }}

    env:
      NEODB_API_TOKEN: ${{ secrets.NEODB_API_TOKEN }}
      BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}

      # ── 连接与节流（仓库 Variables 覆盖，未设置时用默认值）──
      NEODB_BASE_URL: ${{ vars.NEODB_BASE_URL || 'https://neodb.social' }}
      NEODB_REQUEST_DELAY_MS: ${{ vars.NEODB_REQUEST_DELAY_MS || '300' }}
      NEODB_MAX_PAGES: ${{ vars.NEODB_MAX_PAGES || '10' }}
      BANGUMI_USER_AGENT: ${{ vars.BANGUMI_USER_AGENT || 'neodb-to-bangumi/1.0 (+https://github.com/sachikoakina/neodb-to-bangumi)' }}
      BANGUMI_REQUEST_DELAY_MS: ${{ vars.BANGUMI_REQUEST_DELAY_MS || '400' }}

      # ── 迁移行为 ──
      # 本次运行的输入优先；否则取 Variables 的值（默认关闭）。
      FULL_SYNC: ${{ inputs.full_sync && '1' || vars.FULL_SYNC || '0' }}
      SYNC_DRY_RUN: ${{ inputs.dry_run && '1' || vars.SYNC_DRY_RUN || '0' }}
      SYNC_PROGRESS: ${{ inputs.progress && '1' || vars.SYNC_PROGRESS || '0' }}
      SYNC_INCLUDE_SP: ${{ vars.SYNC_INCLUDE_SP || '0' }}
      SYNC_INCLUDE_OP_ED: ${{ vars.SYNC_INCLUDE_OP_ED || '0' }}
      SYNC_SHELF_TYPES: ${{ vars.SYNC_SHELF_TYPES || 'wishlist,progress,complete,dropped' }}
      SYNC_CATEGORIES: ${{ vars.SYNC_CATEGORIES || 'book,movie,tv,music,game' }}
      SYNC_YEAR_TOLERANCE: ${{ vars.SYNC_YEAR_TOLERANCE || '1' }}
      # 书籍类（type 1）的年份容差：初版/再版年份口径差异大，可单独放宽。
      SYNC_YEAR_TOLERANCE_BOOK: ${{ vars.SYNC_YEAR_TOLERANCE_BOOK || '1' }}
      # 匹配严格模式：唯一同名候选证据不足时转待核对，不自动写入（宁可漏配，不可错配）。
      SYNC_MATCH_STRICT: ${{ vars.SYNC_MATCH_STRICT || '1' }}
      SYNC_NEODB_BANGUMI_RATING: ${{ vars.SYNC_NEODB_BANGUMI_RATING || 'bangumi_prefer' }}
      SYNC_NEODB_BANGUMI_COMMENT: ${{ vars.SYNC_NEODB_BANGUMI_COMMENT || 'bangumi_prefer' }}
      SYNC_STATUS_GUARD: ${{ vars.SYNC_STATUS_GUARD || 'off' }}
      SYNC_BANGUMI_PRIVATE_MODE: ${{ vars.SYNC_BANGUMI_PRIVATE_MODE || 'target' }}
      SYNC_BANGUMI_PRIVATE: ${{ vars.SYNC_BANGUMI_PRIVATE || 'false' }}
      SYNC_MAX_ITEMS: ${{ vars.SYNC_MAX_ITEMS || '50' }}
      # 吞吐与预算：0 = 关闭。时间预算到点主动收尾，避免被 60 分钟超时杀掉。
      SYNC_TIME_BUDGET_MS: ${{ vars.SYNC_TIME_BUDGET_MS || '0' }}
      # 单条分集上限：0 = 不限；设小可让长番分多轮补齐。
      SYNC_MAX_EPISODES_PER_ITEM: ${{ vars.SYNC_MAX_EPISODES_PER_ITEM || '0' }}
      # 未匹配条目退避上限天数；0 = 每轮都重试。
      SYNC_UNMATCHED_RETRY_DAYS: ${{ vars.SYNC_UNMATCHED_RETRY_DAYS || '7' }}

      # runner 是临时的，增量状态靠下方的 cache restore/save 跨运行保留；
      # 全量运行会忽略它，从头走一遍。
      SYNC_INCREMENTAL: ${{ vars.SYNC_INCREMENTAL || '1' }}
      SYNC_STATE_FILE: ${{ vars.SYNC_STATE_FILE || '.cache/sync-state.json' }}
      # 仅 FULL_SYNC=1 使用；常规运行不读不写。
      FULL_SYNC_CURSOR_FILE: ${{ vars.FULL_SYNC_CURSOR_FILE || '.cache/full-sync-cursor.json' }}
      # 未匹配清单：跨轮恢复后在原文件上 upsert，并以 review-state-*-stock artifact 长期保留。
      SYNC_UNMATCHED_LOG: ${{ vars.SYNC_UNMATCHED_LOG || '.cache/unmatched.json' }}
      # 只按 lastSeenAt 老化，不按「本轮未出现」淘汰；0 表示永不清理。
      REVIEW_STATE_MAX_AGE_DAYS: ${{ vars.REVIEW_STATE_MAX_AGE_DAYS || '30' }}
      SYNC_REPORT_FILE: ${{ vars.SYNC_REPORT_FILE || '.cache/sync-report.json' }}
      SYNC_SUMMARY_FILE: ${{ vars.SYNC_SUMMARY_FILE || '.cache/sync-summary.md' }}
      # 匹配审计：每条目的匹配对象、证据与结局，错配可离线复核。
      SYNC_MATCH_AUDIT_FILE: ${{ vars.SYNC_MATCH_AUDIT_FILE || '.cache/match-audit.json' }}

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      # 用离线断言给迁移设门禁：不需要凭据与网络，几秒即可；规则被改坏时
      # 应当**在**任何写入 Bangumi 之前就拦下这一轮。
      - run: npm run verify:all

      # 增量指纹：缓存条目不可变，键带 run id，前缀让最新一份被恢复。
      - name: Restore the incremental state
        uses: actions/cache/restore@v4
        with:
          path: .cache/sync-state.json
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-

      # 全量游标：被超时杀掉的全量运行必须能从停下的一页继续。
      # 只有全量参与；常规运行必须从头开始，否则会藏掉最新标记。
      - name: Restore the full-sync cursor
        if: inputs.full_sync
        uses: actions/cache/restore@v4
        with:
          path: .cache/full-sync-cursor.json
          key: full-sync-cursor-${{ github.run_id }}
          restore-keys: |
            full-sync-cursor-

      # 待核对名单跨轮恢复：同一文件在上一轮基础上 upsert，firstSeenAt 才能保留。
      - name: Restore the review state
        uses: actions/cache/restore@v4
        with:
          path: .cache/unmatched.json
          key: review-state-${{ github.run_id }}
          restore-keys: |
            review-state-

      - name: Record UTC run start
        id: run_start
        run: echo "value=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - run: npm run sync

      # 报告与同步成败解耦：失败的那一轮才最需要摘要。作业仍会因上一步失败变红。
      - name: Publish the job summary
        if: always()
        run: |
          if [ -s .cache/sync-summary.md ]; then
            cat .cache/sync-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '> 这一轮没有产出摘要文件：进程在打印汇总之前就退出了，原因见上一节的日志。' >> "$GITHUB_STEP_SUMMARY"
          fi

      # 无论成败都保存状态：被超时杀掉的运行必须能续上，否则大书架永远走不到底。
      - name: Save the incremental state
        if: always() && !inputs.full_sync
        uses: actions/cache/save@v4
        with:
          path: .cache/sync-state.json
          key: sync-state-${{ github.run_id }}

      # 全量游标同样无论成败都保存：中途被杀才有意义。
      - name: Save the full-sync cursor
        if: always() && inputs.full_sync
        uses: actions/cache/save@v4
        with:
          path: .cache/full-sync-cursor.json
          key: full-sync-cursor-${{ github.run_id }}

      # 待核对名单：dry-run 不写文件，因此只在文件存在时保存，避免 cache save 失败。
      - name: Save the review state
        if: always() && !inputs.dry_run && hashFiles('.cache/unmatched.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/unmatched.json
          key: review-state-${{ github.run_id }}

      - name: Upload the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-report-${{ github.run_id }}-${{ steps.run_start.outputs.value }}
          path: |
            .cache/sync-report.json
            .cache/sync-summary.md
            .cache/full-sync-cursor.json
            .cache/unmatched-dryrun.json
          if-no-files-found: warn
          retention-days: 7

      # 待核对状态载体：与 7 天的本轮报表分开，长期保留供人工跟进。
      # 匹配审计同样长期保留：错配复核与清理清单都以它为依据。
      # artifact 名只用 UTC 时间戳；90 天是公开仓库允许的上限。
      - name: Upload the review state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-state-${{ github.run_id }}-${{ steps.run_start.outputs.value }}-stock
          path: |
            .cache/unmatched.json
            .cache/match-audit.json
            .cache/sync-summary.md
          if-no-files-found: warn
          retention-days: 90
